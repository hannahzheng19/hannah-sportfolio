<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hannah | UC Berkeley Portfolio</title>
    
    <!-- External Libraries (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfd;
            scroll-behavior: smooth;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .berkeley-blue { color: #003262; }
        .bg-berkeley-blue { background-color: #003262; }
        .berkeley-gold { color: #FDB515; }
        .bg-berkeley-gold { background-color: #FDB515; }
        
        /* Custom scrollbar for reader */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PROJECTS = [
            {
                id: '1',
                title: 'Solar Racecar Pedal Box',
                category: 'Mechanical',
                shortDescription: 'Designing and Manufacturing Aluminum and Carbon Fiber Pedal Box.',
                longDescription: 'Part of the UC Berkeley Solar Vehicle team, this project entails designing and manufacturing the pedal box system for a solar power racecar. We used Solidworks to CAD multiple variations of pedal arm, mounting system and foot pad designs. We optimized for volume occupied and weight through FEA simulations, maintaining FOS above 2 with an applied force of 1000N (~200lbfs). We will manufacture the footpad, pedal arms, mounting system, and carbon fiber composite panels, working with other subsystems to ensure smooth integration.This solar racecar will be competing against other universities internationally in a 3 day endurance style race.',
                imageUrl: './Public/fullassemblypedal.jpg',
                pdfUrl: './Public/pedalboxslides.pdf',
                tags: ['Solidworks', 'FEA Simulation', 'ANSYS', '3D Printing', 'Waterjet', 'CNC Machining'],
                date: 'Fall 2025'
            },
            {
                id: '2',
                title: 'BPM Cable Protection',
                category: 'Design',
                shortDescription: 'Mechanical strain protection for Beam Position Monitor cables.',
                longDescription: 'To efficiently upgrade the Berkeley National Lab particle accelerator, all 10,000+ beam position monitor (BPM) cables must be terminated prior to the shutdown of the accelerator. However, coaxial cables are mechanically sensitive and have a higher risk of damaging the inner copper wiring when being pulled through the cable trays. This project prevents damage to these cables through translating forces into the cable jacket and limiting the bend radius. Using Creo Parametric, I designed and 3D printed, with ABS filament, all protectors to fit precisely on a variety of different termination installation processes.',
                imageUrl: './Public/cableprotect.jpg',
                pdfUrl: './Public/BPMdoc.pdf',
                tags: ['Creo Parametric', '3D Printing'],
                date: 'Fall 2025'
            },
            {
                id: '3',
                title: 'Floor Assembly Standardization',
                category: 'Design',
                shortDescription: 'Maintaining and Optimizing Large Scale Assembly Models.',
                longDescription: 'In this project, I managed a master assembly with 570,000+ parts and modified subassemblies to optimize contractor communication. I updated the floor plan upon any change in designs from a team of 40+ engineers to accurately reflect the upcoming construction tasks needed.',
                imageUrl: './Public/floorfull.png',
                pdfUrl: './Public/floormods.pdf',
                tags: ['Creo Parametric', 'Windchill'],
                date: 'Fall 2025'
            },
            {
                id: '4',
                title: 'BIM Model Shift',
                category: 'Software',
                shortDescription: 'Building Smooth Transitions Between Softwares.',
                longDescription: 'In this project, I synthesized data on the structure of Revit, a building information modeling software, and how to transition CAD files into BIM models for efficient contractor communication.',
                imageUrl: './Public/revit.jpg',
                pdfUrl: './Public/revitslides.pdf',
                tags: ['Creo Parametric', 'Revit'],
                date: 'Summer 2025'
            },
            {
                id: '5',
                title: 'Miniature Wind Turbine',
                category: 'Mechanical',
                shortDescription: 'Designing for Maximum Power Generation in Wind Power.',
                longDescription: 'In this project, I designed wind turbine blades, researching optimal angle of attack and angle of twist, and a wind turbine tower. I 3D-printed the blades and tower base using PLA and experimented with different infills until we found the neccessary stiffness to allow for flexibility while remaining durable. We performed stiffness and power generation efficiency testing on our design using a wind tunnel.',
                imageUrl: './Public/windturbinetower.jpg',
                pdfUrl: './Public/windturbinereport.pdf',
                tags: ['Solidworks', '3D Printing', 'Wind Tunnel Testing'],
                date: 'Spring 2025'
            },
            {
                id: '6',
                title: 'Wheel Rim Carrier',
                category: 'Design',
                shortDescription: 'Early Stage Design and Testing of Wheel Spokes.',
                longDescription: 'In this project, I designed the spokes for an existing wheel and hub to withstand a brake and bump force. I used Solidworks to CAD the wheel rim carrier as well as running bump and brake force simulations to test factor of safety, stress and strain. This project was my firts introduction to Solidworks and FEA simulations, building a foundation for later projects.',
                imageUrl: './Public/wheelrim.jpg',
                pdfUrl: './Public/wheeldoc.pdf',
                tags: ['Solidworks', 'FEA Simulations'],
                date: 'Fall 2024'
            },
        ];

        const ProjectCard = ({ project, onClick }) => (
            <div 
                className="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 cursor-pointer transform hover:-translate-y-2 border border-slate-100 flex flex-col h-full"
                onClick={() => onClick(project)}
            >
                <div className="aspect-[16/10] overflow-hidden relative">
                    <img 
                        src={project.imageUrl} 
                        alt={project.title} 
                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                    />
                    <div className="absolute inset-0 bg-[#003262]/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                        <span className="text-white text-xs font-black uppercase tracking-widest border-2 border-white px-6 py-2 rounded-full backdrop-blur-sm">
                            View Project
                        </span>
                    </div>
                </div>
                <div className="p-8 flex flex-col flex-1">
                    <div className="flex items-center justify-between mb-4">
                        <span className="text-[9px] font-black uppercase tracking-widest text-blue-800 bg-blue-50 px-3 py-1 rounded-full">
                            {project.category}
                        </span>
                        <span className="text-[9px] font-medium text-slate-400">{project.date}</span>
                    </div>
                    <h3 className="text-2xl font-serif font-bold text-slate-900 mb-3 group-hover:text-[#003262] transition-colors leading-tight">
                        {project.title}
                    </h3>
                    <p className="text-slate-500 text-sm leading-relaxed line-clamp-2">
                        {project.shortDescription}
                    </p>
                    <div className="mt-auto pt-6 flex flex-wrap gap-2">
                        {project.tags.slice(0, 3).map(tag => (
                            <span key={tag} className="text-[10px] text-slate-400 font-medium">#{tag}</span>
                        ))}
                    </div>
                </div>
            </div>
        );

        const ProjectModal = ({ project, onClose }) => {
            if (!project) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-0 md:p-6 lg:p-12">
                    <div className="absolute inset-0 bg-slate-900/95 backdrop-blur-lg" onClick={onClose}></div>
                    <div className="relative bg-white w-full h-full md:max-w-7xl rounded-none md:rounded-[48px] shadow-2xl flex flex-col md:flex-row overflow-hidden animate-fade-up">
                        <div className="w-full md:w-96 lg:w-[480px] flex flex-col h-1/2 md:h-full border-b md:border-b-0 md:border-r border-slate-100 bg-white p-8 md:p-14 overflow-y-auto custom-scrollbar">
                            <button onClick={onClose} className="mb-14 flex items-center gap-3 text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 hover:text-[#003262] transition-all group">
                                <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-[#003262] transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M15 19l-7-7 7-7" />

                                </div>

                                <span className="text-[10px] font-black uppercase tracking-[0.4em] text-[#003262]/60">{project.category}</span>
                            </div>

                            <div className="space-y-10">
                                <div className="space-y-4">
                                    <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-900">Project Background</h4>
                                    <p className="text-slate-600 leading-relaxed text-base font-light">{project.longDescription}</p>
                                </div>
                                
                                <div className="space-y-4">
                                    <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-900">Technical Toolkit</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {project.tags.map(tag => (
                                            <span key={tag} className="px-4 py-2 bg-slate-50 border border-slate-100 text-slate-500 rounded-xl text-[10px] font-bold">{tag}</span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="mt-auto pt-16">
                                <a href={project.pdfUrl} target="_blank" className="flex items-center justify-center w-full py-5 bg-[#003262] text-white rounded-2xl font-bold text-[11px] uppercase tracking-widest shadow-2xl shadow-blue-900/30 hover:bg-blue-900 hover:-translate-y-1 transition-all">
                                    Download Full Documentation
                                </a>
                            </div>
                        </div>
                        <div className="flex-1 bg-slate-100 relative">
                            <div className="absolute top-6 right-6 z-10 hidden lg:block">
                                <div className="bg-white/80 backdrop-blur-md px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest text-slate-900 border border-slate-200">Interactive Preview</div>
                            </div>
                            <iframe src={`${project.pdfUrl}#toolbar=0&view=FitH`} className="w-full h-full border-none" title={project.title} />
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedProject, setSelectedProject] = useState(null);

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="fixed top-0 w-full z-40 bg-white/70 backdrop-blur-2xl border-b border-slate-50">
                        <div className="max-w-7xl mx-auto px-8 h-24 flex items-center justify-between">
                            <div className="flex items-center gap-5">
                                <div className="w-12 h-12 rounded-2xl bg-[#003262] flex items-center justify-center text-white font-serif font-bold text-2xl shadow-xl shadow-blue-900/10">H</div>
                                <div>
                                    <h1 className="font-serif font-bold text-xl text-[#003262] tracking-tight">Hannah</h1>
                                    <p className="text-[9px] font-black tracking-[0.4em] text-slate-400 uppercase">Berkeley Engineering</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-10">
                                <a href="mailto:hannah_zheng@berkeley.edu" className="text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-[#003262] transition-colors">Inquiries</a>
                                <div className="h-5 w-px bg-slate-100"></div>
                                <p className="text-[10px] font-black italic text-[#003262]">Regents'and Chancellor's</p>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="pt-48 pb-32 px-8 bg-white overflow-hidden relative">
                        <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center gap-24 relative z-10">
                            <div className="flex-1 text-center lg:text-left animate-fade-up">
                                <div className="flex items-center justify-center lg:justify-start gap-5 mb-12">
                                    <div className="h-[2px] w-14 bg-berkeley-gold"></div>
                                    <span className="text-[11px] font-black uppercase tracking-[0.5em] text-[#003262]/50">Portfolio Showcase</span>
                                </div>
                                <h1 className="text-7xl md:text-[140px] font-serif font-bold text-slate-900 leading-[0.9] mb-14">
                                    I'm <span className="text-[#003262]">Hannah</span>.
                                </h1>
                                <p className="text-xl md:text-3xl text-slate-500 leading-relaxed font-light mb-16 max-w-xl mx-auto lg:mx-0">
                                    Engineering student at UC Berkeley passionate about sustainable innovation through CAD and hands-on fabrication. Experienced in multiple engineering fields from civil, biomedical, and mechanical.
                                </p>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-10 pt-8 border-t border-slate-100">
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[9px] font-black uppercase tracking-widest text-slate-400">Department</span>
                                        <span className="text-sm font-bold text-[#003262]">Mechanical Engineering</span>
                                    </div>
                                    <div className="flex flex-col gap-1 hidden md:flex">
                                        <span className="text-[9px] font-black uppercase tracking-widest text-slate-400">Location</span>
                                        <span className="text-sm font-bold text-[#003262]">Berkeley, CA</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 w-full relative">
                                <div className="grid grid-cols-2 gap-5 relative z-10">
                                    <div className="space-y-5 pt-16">
                                        <div className="aspect-[4/5] rounded-[40px] overflow-hidden shadow-2xl transition-all duration-700 hover:-translate-y-4">
                                            <img src="./Public/headshot.JPG" className="w-full h-full object-cover" alt="Hannah" />
                                        </div>
                                        <div className="aspect-square rounded-[40px] overflow-hidden shadow-xl border-8 border-white">
                                            <img src="./Public/solidworksvice.JPG" className="w-full h-full object-cover" alt="cad_model" />
                                        </div>
                                    </div>
                                    <div className="space-y-5">
                                        <div className="aspect-square rounded-[40px] overflow-hidden shadow-xl border-8 border-white">
                                            <img src="./Public/engineeringdrawing.JPG" className="w-full h-full object-cover" alt="drawingmodel" />
                                        </div>
                                        <div className="aspect-[4/5] rounded-[40px] overflow-hidden shadow-2xl transition-all duration-700 hover:translate-y-4">
                                            <img src="./Public/lasercut.JPG" className="w-full h-full object-cover" alt="lasercut" />
                                        </div>
                                    </div>
                                </div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[140%] h-[140%] bg-gradient-to-tr from-[#003262]/10 to-[#FDB515]/10 rounded-full blur-[100px] -z-10"></div>
                            </div>
                        </div>
                    </header>

                    {/* Projects Grid */}
                    <main id="projects" className="py-40 bg-[#fcfcfd]">
                        <div className="max-w-7xl mx-auto px-8">
                            <div className="mb-28 flex flex-col md:flex-row md:items-end justify-between gap-12">
                                <div className="max-w-2xl text-center md:text-left">
                                    <h2 className="text-5xl md:text-6xl font-serif font-bold text-slate-900 mb-8 tracking-tight">Technical Projects</h2>
                                    <p className="text-slate-500 font-light text-xl leading-relaxed">A detailed archive of my engineering journey at Berkeley, documenting key breakthroughs in distributed systems and robotics.</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-14">
                                {PROJECTS.map((project) => (
                                    <ProjectCard 
                                        key={project.id} 
                                        project={project} 
                                        onClick={setSelectedProject} 
                                    />
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Simple Footer */}
                    <footer className="py-32 bg-white border-t border-slate-50">
                        <div className="max-w-7xl mx-auto px-8 flex flex-col items-center gap-16">
                            <div className="flex items-center gap-12">
                                <a href="https://www.linkedin.com/in/hannah-zheng/" className="text-slate-400 hover:text-[#003262] font-black text-[24px] uppercase tracking-[0.5em] transition-all hover:tracking-[0.7em]">LinkedIn</a>
                                <a href="./Public/HannahZheng_Resume.pdf" className="text-slate-400 hover:text-[#003262] font-black text-[24px] uppercase tracking-[0.5em] transition-all hover:tracking-[0.7em]">Resume</a>
                            </div>
                            <div className="h-px w-32 bg-slate-100"></div>
                            <div className="flex flex-col items-center gap-4">
                                <p className="text-[10px] font-black italic text-[#003262]/20 tracking-[0.8em] uppercase">Regents' and Chancellor's Scholar • Berkeley Engineering</p>
                            </div>
                        </div>
                    </footer>

                    <ProjectModal 
                        project={selectedProject} 
                        onClose={() => setSelectedProject(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
